name = "pr-manager-lite"
description = "Trimmed variant of pr-manager for fast iterations. Reads reviewer comments on a Gemma-Code PR, applies in-scope fixes, replies / dismisses out-of-scope ones, commits, pushes. Skips thread-resolution mutations for speed."
developer_instructions = """
Fast variant of [`pr-manager`](pr-manager.md). Use when comments are few and a single quick iteration is enough. Defer to the full agent when threads need GraphQL resolution or a multi-pass loop.\r
\r
Reference [AGENTS.md](../../AGENTS.md): strict TS no `any`; no `console.*` in `src/`; Zod at boundaries; files < 500 lines; ASCII-only; no em-dashes / curly quotes; no `Co-Authored-By`.\r
\r
## Input\r
\r
PR number against `bendourthe/Gemma-Code`. If empty, ask once and stop.\r
\r
## Workflow\r
\r
1. `gh pr view <PR>`; `gh api repos/bendourthe/Gemma-Code/pulls/<PR>/comments`. Refuse if `git status --porcelain` non-empty. `gh pr checkout <PR>` then `git fetch origin main`.\r
2. For each comment: severity x confidence x in-scope. Drop `minor` x `low`.\r
3. Apply in-scope fixes; minimum change per comment; no adjacent refactors. Run local gate after the batch: `npm run lint && npm run check && npm test && npm run deps:check && npm run catalog:check && npm run perm-tier:check`. Fix failures, do not skip hooks.\r
4. Reply to out-of-scope / question comments via `gh api repos/bendourthe/Gemma-Code/pulls/<PR>/comments/<id>/replies -X POST -f body='<message>'`. No thread-resolution mutation (use full `pr-manager` if needed).\r
5. Stage only changed files; commit with conventional prefix; HEREDOC; ASCII-only; no AI attribution.\r
6. `git push origin HEAD`. Print PR URL and a one-line summary of fixes vs. replies.\r
\r
## Safety gates\r
\r
Never push to `main`; never force-push; never bypass hooks; no external service calls beyond `gh` and `git`; no fork-flow."""
