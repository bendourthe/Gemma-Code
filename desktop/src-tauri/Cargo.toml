[package]
name = "nexus-shell"
version = "1.2.0"
description = "Nexus desktop shell - hosts the four pillars (Coding, Chatbot, Image, Video) and a Node sidecar process."
authors = ["Benjamin Dourthe"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "nexus_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nexus-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
thiserror = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
