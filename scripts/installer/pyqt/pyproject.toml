[project]
name = "gemma-code-installer"
version = "0.3.0"
description = "Cross-platform PyQt5 wizard installer for Gemma Code"
requires-python = ">=3.11"
dependencies = [
    "PyQt5>=5.15,<5.15.12",
    # Binary Qt distribution. PyPI's wheel coverage for `pyqt5-qt5` differs
    # by platform:
    #   - win_amd64:        only `5.15.2` ships (no Windows wheels for 5.15.3+)
    #   - manylinux x86_64: `5.15.2` and `5.15.11+` both ship
    #   - macosx_arm64:     only `5.15.11+` ships (no `5.15.2`)
    # No single version covers all three CI platforms, so we split the
    # constraint with PEP 508 markers. Both pip and uv honour markers in
    # pyproject.toml dependency strings, so each platform resolves to a
    # version that actually has a compatible wheel.
    "PyQt5-Qt5==5.15.2 ; sys_platform != 'darwin'",
    "PyQt5-Qt5>=5.15.11,<5.16 ; sys_platform == 'darwin'",
    "httpx>=0.27.0",
]

[project.scripts]
gemma-installer = "gemma_installer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemma_installer"]

[dependency-groups]
dev = [
    "PyInstaller>=6.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["src"]
omit = ["src/gemma_installer/main.py"]

[tool.mypy]
strict = true
python_version = "3.11"
