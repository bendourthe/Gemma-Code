[project]
name = "gemma-code-installer"
version = "0.3.0"
description = "Cross-platform PyQt5 wizard installer for Gemma Code"
requires-python = ">=3.11"
dependencies = [
    "PyQt5>=5.15,<5.15.12",
    # Binary Qt distribution. The exact `==5.15.2` pin used to work on Linux
    # x86_64 but was unsatisfiable on macOS arm64, where PyPI's wheel index
    # only carries 5.15.11+. Loosen to a range so each platform picks the
    # newest compatible 5.15 wheel that exists for it. PyQt5 5.15.x and
    # PyQt5-Qt5 5.15.x stay binary-compatible within the 5.15 line.
    "PyQt5-Qt5>=5.15.2,<5.16",
    "httpx>=0.27.0",
]

[project.scripts]
gemma-installer = "gemma_installer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemma_installer"]

[dependency-groups]
dev = [
    "PyInstaller>=6.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["src"]
omit = ["src/gemma_installer/main.py"]

[tool.mypy]
strict = true
python_version = "3.11"
