[project]
name = "nexus-installer"
version = "1.1.0"
description = "Cross-platform PyQt5 wizard installer for Nexus (formerly Gemma Code)"
requires-python = ">=3.11"
dependencies = [
    "PyQt5>=5.15,<5.15.12",
    # Binary Qt distribution. PyPI's wheel coverage for `pyqt5-qt5` differs
    # by platform:
    #   - win_amd64:        only `5.15.2` ships (no Windows wheels for 5.15.3+)
    #   - manylinux x86_64: `5.15.2` and `5.15.11+` both ship
    #   - macosx_arm64:     only `5.15.11+` ships (no `5.15.2`)
    # No single version covers all three CI platforms, so we split the
    # constraint with PEP 508 markers. Both pip and uv honour markers in
    # pyproject.toml dependency strings, so each platform resolves to a
    # version that actually has a compatible wheel.
    "PyQt5-Qt5==5.15.2 ; sys_platform != 'darwin'",
    "PyQt5-Qt5>=5.15.11,<5.16 ; sys_platform == 'darwin'",
    "httpx>=0.27.0",
    # v1.11.0 Phase 3 (T302): the Linux Ollama step installs the pinned
    # release asset ollama-linux-amd64.tar.zst (deterministic + hash-verified,
    # replacing the undeterministic install.sh flow); zstandard decompresses it.
    "zstandard>=0.22",
]

[project.scripts]
nexus-installer = "nexus_installer.main:main"

# The CI installer-package-check jobs install dev tooling with the extra syntax
# (`pip install --editable "scripts/installer[dev]"`). PEP 735
# `[dependency-groups]` (below) is only resolvable by `uv` / `pip --group`, so a
# bare `[dev]` extra was previously unknown to pip -- it emitted
# "does not provide the extra 'dev'" and installed none of the dev tooling.
# Mirror the group as a real optional-dependencies extra so both pip and uv
# install the same dev set without a warning.
[project.optional-dependencies]
dev = [
    "PyInstaller>=6.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    # Pillow backs the brand-icon generator (scripts/desktop/generate-icons.py)
    # and the T204 icon alpha/rounding assertions (tests/test_icon_generation.py),
    # which skip cleanly if it is absent.
    "Pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_installer"]

[dependency-groups]
dev = [
    "PyInstaller>=6.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "Pillow>=10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["src"]
omit = ["src/nexus_installer/main.py"]

[tool.mypy]
strict = true
python_version = "3.11"
