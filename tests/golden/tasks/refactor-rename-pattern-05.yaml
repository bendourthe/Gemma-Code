id: refactor-rename-pattern-05
name: Remove Hungarian notation
category: refactor
description: |
  src/a.ts, src/b.ts, src/c.ts, src/d.ts use Hungarian-notation variable
  names (strName, intCount, boolReady). Rename every variable to camelCase
  (name, count, ready) and update every reference. `npx tsc --noEmit` must
  still pass.
initial_state: snapshots/refactor-rename-pattern-05
expected_files_changed:
  - src/a.ts
  - src/b.ts
  - src/c.ts
  - src/d.ts
success_criteria:
  - type: output_contains
    target: "grep -R \"strName\\|intCount\\|boolReady\" src || true"
    pattern: "^$"
    description: no Hungarian-notation identifiers remain
max_iterations: 15
timeout_seconds: 180
model_tier: e4b
tags: [medium, typescript, refactor]
