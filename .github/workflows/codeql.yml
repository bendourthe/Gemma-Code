name: CodeQL

# v0.9.0 Phase 7 (sub-task 7.4) -- GitHub CodeQL SAST scan over the
# TypeScript/JavaScript surface in `src/` and `bin/`. Starts non-blocking
# (continue-on-error) so a fresh advisory ruleset rollout cannot stall PRs;
# the SARIF report is still uploaded to the GitHub Security tab for triage.
# After one clean week (no critical/high findings on `main`) flip
# `continue-on-error: false` to gate merges on critical+high.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly scan independent of activity: catches advisories that land
    # against the existing tree even when no new code lands that week.
    - cron: "27 4 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    # Cost control: skip on Dependabot PRs. A dependency bump does not need a
    # full SAST scan, and push-to-main + the weekly schedule still cover the tree.
    if: ${{ github.actor != 'dependabot[bot]' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    continue-on-error: true # nexus-check-allow: no-disabled-ci-check -- baseline CodeQL rollout is intentionally non-blocking until gating is flipped on (see header)
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f411752efdf656cb71aa17b755b22c890960da1d # v3.35.5
        with:
          languages: ${{ matrix.language }}
          # `security-and-quality` is the broader query pack -- start there
          # while the baseline is non-blocking; tighten to `security-extended`
          # once gating is on.
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f411752efdf656cb71aa17b755b22c890960da1d # v3.35.5
        with:
          category: "/language:${{ matrix.language }}"
