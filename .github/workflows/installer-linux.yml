name: Installer build (Linux)

# Builds NexusSetup-x86_64.AppImage -- the Linux one-shot installer. v1.9.0
# Phase 1 (T102/T103) made the PyInstaller onefile (spec APP_NAME
# "nexus-setup") the distributable directly: build-linux.sh freezes it into a
# staging dir and packages exactly one artifact,
# dist/NexusSetup-x86_64.AppImage, at the repo root. There is no NSIS/outer-
# shell layer on any platform anymore.
#
# Runtime note: the AppImage links against glibc 2.31+ and needs FUSE
# (libfuse2) to mount; both caveats are documented on the download page.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for the manual run"
        required: false
        default: "manual rehearsal"
  push:
    tags:
      - "v*"

concurrency:
  group: installer-build-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-installer:
    name: Build Nexus AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.x"
          cache: "npm"

      # appimagetool is itself an AppImage and needs FUSE to run; the xcb /
      # xkb libraries satisfy PyQt5's link-time deps during the PyInstaller
      # analysis. build-linux.sh picks up /tmp/appimagetool when present.
      - name: Install AppImage tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse libfuse2 libxcb-xinerama0 libxkbcommon-x11-0
          wget -O /tmp/appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool

      - name: Resolve pinned versions
        run: |
          python -c "import json; data=json.load(open('scripts/installer/devai-hub-baseline.json')); print('devai-hub baseline tag:', data['source']['tag'])"

      # The wizard bundles the VSIX (PyInstaller datas); vsce packages the
      # root workspace (the repo root IS the nexus-coding extension package,
      # same as release.yml's build-vsix job).
      - name: Build VSIX (Nexus Coding extension)
        run: |
          npm ci --prefer-offline --no-audit
          npm run build
          npx vsce package --no-dependencies

      - name: Build installer (PyInstaller onefile + AppImage)
        run: bash scripts/installer/pyqt/build/build-linux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: NexusSetup-linux
          path: dist/NexusSetup-x86_64.AppImage
          if-no-files-found: warn
          retention-days: 14
