name: Installer rehearsal (Linux, non-release)

# Manual non-release rehearsal for the Linux Python wizard build. v1.9.0 Phase
# 1 (T102/T103) made the PyInstaller onefile (spec APP_NAME "nexus-setup") the
# distributable directly: build-linux.sh freezes it into a staging dir and
# packages exactly one artifact,
# dist/NexusSetup-x86_64.AppImage, at the repo root. There is no NSIS/outer-
# shell layer on any platform anymore.
#
# This workflow is intentionally dispatch-only and its artifact is not a
# v2.2.9 release asset because the Python wizard does not stage the desktop
# payload on Linux. Tag releases publish the platform VSIX only; raw Tauri
# desktop bundles are withheld until they embed the pinned runtime.
#
# Runtime note: the AppImage links against glibc 2.35+ and needs FUSE
# (libfuse2) to mount; both caveats are documented on the download page.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for the manual non-release rehearsal"
        required: false
        default: "manual rehearsal"

concurrency:
  group: installer-build-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux-installer:
    name: Build manual Linux installer rehearsal
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.x"
          cache: "npm"

      # appimagetool is itself an AppImage and needs FUSE to run; the xcb /
      # xkb libraries satisfy PyQt5's link-time deps during the PyInstaller
      # analysis. build-linux.sh picks up /tmp/appimagetool when present.
      - name: Install AppImage tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fuse libfuse2 libxcb-xinerama0 libxkbcommon-x11-0
          wget -O /tmp/appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool

      # The wizard bundles the VSIX (PyInstaller datas). The canonical script
      # packages the root workspace and rebuilds native modules for VS Code
      # Electron before the installer consumes the artifact.
      - name: Build VSIX (Nexus Coding extension)
        shell: pwsh
        run: ./scripts/build-vsix.ps1 -SkipTests

      - name: Build non-release installer rehearsal (PyInstaller onefile + AppImage)
        env:
          # Hosted Ubuntu runners have no usable /dev/fuse; build-linux.sh
          # also sets this, but keep it on the job so a stale script still
          # has a chance.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash scripts/installer/build/build-linux.sh

      - name: Upload non-release rehearsal artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: NexusSetup-linux-rehearsal
          path: dist/NexusSetup-x86_64.AppImage
          if-no-files-found: warn
          retention-days: 14
