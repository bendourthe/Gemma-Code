name: Installer build (Windows)

# Builds the v1.0.0 single-binary Windows installer (Nexus-1.0.0-Setup.exe).
# Implements the pipeline sketched in
# scripts/installer/build/windows-pipeline.md. Currently a placeholder gated
# behind workflow_dispatch -- the payload-fetching script and NSIS template
# are filled in across Phase 9.2-9.7. Once the artifact builds cleanly on a
# Windows runner the trigger expands to `push: tags: v1.0.0*`.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for the manual run (release rehearsal, payload refresh, ...)"
        required: false
        default: "manual rehearsal"

concurrency:
  group: installer-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    name: Build Nexus-1.0.0-Setup.exe
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.x"

      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: "latest"

      # NSIS ships in the windows-latest runner image since 2024-Q4.
      # Verify it is on PATH so the job fails fast if Microsoft removes it.
      - name: Verify NSIS is available
        shell: pwsh
        run: |
          $candidate = "$env:ProgramFiles (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $candidate)) {
            Write-Error "NSIS not found at $candidate. Install via choco install nsis -y."
            exit 1
          }
          & $candidate /VERSION

      # Placeholder steps -- expanded in Phase 9.2-9.7. Each step is a no-op
      # echo so the workflow stays valid until the implementation lands.

      - name: Resolve pinned versions
        run: |
          Write-Host "TODO Phase 9.2: read scripts/installer/devai-hub-baseline.json + pyproject.toml + .nvmrc"
        shell: pwsh

      - name: Fetch payload (CUDA, Python, wheels, Node, Ollama, ffmpeg, DevAI-Hub)
        run: |
          Write-Host "TODO Phase 9.2-9.6: run scripts/installer/build/fetch-payload.py --out build/payload/"
        shell: pwsh

      - name: Compute payload manifest.json
        run: |
          Write-Host "TODO Phase 9.2: emit SHA-256 manifest into build/payload/manifest.json"
        shell: pwsh

      - name: Freeze the wizard with PyInstaller
        working-directory: scripts/installer/pyqt
        run: |
          Write-Host "TODO Phase 9.3+: uv sync; uv run pyinstaller --onefile --windowed --name nexus-installer src/nexus_installer/main.py"
        shell: pwsh

      - name: Compile NSIS outer (Nexus-1.0.0-Setup.exe)
        run: |
          Write-Host "TODO Phase 9.7: & $env:ProgramFiles' (x86)\NSIS\makensis.exe' scripts/installer/build/nsis/nexus-setup.nsi"
        shell: pwsh

      - name: Smoke-run the installer in silent mode
        run: |
          Write-Host "TODO Phase 9.7: build/Nexus-1.0.0-Setup.exe /S /D=C:\Nexus-Smoke; assert exit code 0"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: Nexus-1.0.0-Setup
          path: |
            build/Nexus-1.0.0-Setup.exe
            build/payload/manifest.json
          if-no-files-found: warn
          retention-days: 14
