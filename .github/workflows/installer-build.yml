name: Installer build (Windows)

# Builds NexusSetup.exe -- the Windows one-shot installer: the PyQt wizard
# frozen by PyInstaller as a single onefile (dist/NexusSetup.exe), then
# smoke-tested by booting the frozen exe (--version + --check-registry).
# v1.9.0 Phase 1 (T102/T103) dropped the NSIS outer shell: the onefile IS the
# distributable, so double-clicking it opens exactly one modern branded window
# (no generic pre-wizard dialog). The pipeline sketch lives in
# scripts/installer/build/windows-pipeline.md.
#
# The exe is SLIM by design (operator decision 2026-07-03): the wizard
# downloads dependencies, models, and the desktop app at install time, all
# SHA-256-verified.
#
# Trigger: workflow_dispatch only while the Actions freeze holds (until
# 2026-08-01, $0 budget). The Phase 6 post-freeze rehearsal expands this to
# `push: tags: v*` once the artifact builds cleanly on a Windows runner.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for the manual run (release rehearsal, ...)"
        required: false
        default: "manual rehearsal"

concurrency:
  group: installer-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    name: Build NexusSetup.exe
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.x"
          cache: "npm"

      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: "latest"

      - name: Resolve pinned versions
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Write-Host "package.json version: $version"
          $baseline = Get-Content scripts/installer/devai-hub-baseline.json | ConvertFrom-Json
          Write-Host "devai-hub baseline tag: $($baseline.source.tag)"

      # The wizard bundles the VSIX (PyInstaller datas); vsce packages the
      # root workspace (the repo root IS the nexus-coding extension package,
      # same as release.yml's build-vsix job).
      - name: Build VSIX (Nexus Coding extension)
        shell: pwsh
        run: |
          npm ci --prefer-offline --no-audit
          npm run build
          npx vsce package --no-dependencies

      - name: Build NexusSetup.exe (PyInstaller onefile)
        shell: pwsh
        run: |
          pwsh -NonInteractive -File scripts/installer/build/build-windows.ps1 -SkipSign

      - name: Smoke-test the installer (boot the frozen exe)
        shell: pwsh
        run: |
          pwsh -NonInteractive -File scripts/installer/build/smoke-windows-exe.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: NexusSetup-windows
          path: dist/NexusSetup.exe
          if-no-files-found: warn
          retention-days: 14
