name: Installer build (Windows)

# Builds NexusSetup.exe -- the Windows one-shot installer: the PyQt wizard
# frozen by PyInstaller as a single onefile (dist/NexusSetup.exe), then
# smoke-tested by booting the frozen exe (--version + --check-registry).
# v1.9.0 Phase 1 (T102/T103) dropped the NSIS outer shell: the onefile IS the
# distributable, so double-clicking it opens exactly one modern branded window
# (no generic pre-wizard dialog). The pipeline sketch lives in
# scripts/installer/build/windows-pipeline.md.
#
# The exe embeds the host-matched VSIX and current-version Tauri desktop
# installer. The wizard downloads the remaining dependencies and models at
# install time under their existing verification contracts.
#
# Trigger: workflow_dispatch only. Tag-triggered Windows publishing lives in
# release.yml. This standalone rehearsal builds the exact current-version
# Tauri NSIS payload locally before freezing the wizard, so it exercises the
# same fail-closed desktop-payload contract without depending on another job.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for the manual run (release rehearsal, ...)"
        required: false
        default: "manual rehearsal"

concurrency:
  group: installer-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-installer:
    name: Build NexusSetup.exe
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.x"
          cache: "npm"

      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: "latest"

      - name: Resolve pinned versions
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Write-Host "package.json version: $version"

      # The wizard bundles the VSIX (PyInstaller datas). The canonical script
      # packages the root workspace and rebuilds native modules for VS Code
      # Electron before the installer consumes the artifact.
      - name: Build VSIX (Nexus Coding extension)
        shell: pwsh
        run: ./scripts/build-vsix.ps1 -SkipTests

      - name: Sync Tauri version from package.json
        run: node scripts/sync-tauri-version.mjs

      - name: Build desktop sidecar (fail-fast)
        working-directory: desktop
        run: npm run build:sidecar

      - name: Build current-version Windows desktop bundle
        working-directory: desktop
        run: npm run build:shell

      - name: Verify exact current-version desktop bundle
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $bundleDir = "desktop/src-tauri/target/release/bundle/nsis"
          $matches = @(Get-ChildItem -LiteralPath $bundleDir -Filter "Nexus AI Studio_${version}_x64-setup.exe" -File)
          if ($matches.Count -ne 1) {
            throw "Expected exactly one Windows desktop bundle for version $version; found $($matches.Count)"
          }

      - name: Build NexusSetup.exe (PyInstaller onefile)
        shell: pwsh
        run: |
          pwsh -NonInteractive -File scripts/installer/build/build-windows.ps1 -SkipSign

      - name: Smoke-test the installer (boot the frozen exe)
        shell: pwsh
        run: |
          pwsh -NonInteractive -File scripts/installer/build/smoke-windows-exe.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: NexusSetup-windows
          path: dist/NexusSetup.exe
          if-no-files-found: warn
          retention-days: 14
