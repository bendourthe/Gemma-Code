name: Semantic Release

# Runs on every push to main. Analyzes conventional commits and, when a new
# release is warranted, updates CHANGELOG.md, bumps package.json, commits
# with `[skip ci]`, tags `vX.Y.Z`, and creates a GitHub release. The tag
# push triggers the existing release.yml which builds the VSIX and the
# Windows/macOS installers.
#
# The plugin chain in `.releaserc.json` is changelog -> git -> github. We
# deliberately do NOT include `@semantic-release/npm` because Gemma Code
# ships as a VSIX, not as an npm package.

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # semantic-release v25 requires Node >= 22.14.0 || >= 24.10.0. The rest
      # of the project still targets Node 18 (engines.node), but this
      # workflow is the only consumer of semantic-release, so it pins a
      # newer Node here in isolation.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci --prefer-offline --no-audit

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
