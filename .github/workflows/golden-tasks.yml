name: Golden Tasks

# Runs the golden task evaluation suite. Conservative trigger: manual
# dispatch + a weekly Sunday cron. Not wired into the PR/nightly pipeline
# to keep CI fast and cheap until baselines are stable.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model tier to evaluate"
        default: "gemma4:e2b"
        type: choice
        options: ["gemma4:e2b", "gemma4:e4b"]
      categories:
        description: "Task categories (comma-separated, or 'all')"
        default: "all"
  schedule:
    - cron: "0 4 * * 0"  # Sunday 04:00 UTC

concurrency:
  group: golden-tasks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-golden-tasks:
    name: "Golden tasks (${{ matrix.tier }})"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - tier: e2b
            model: "gemma4:e2b"
          - tier: e4b
            model: "gemma4:e4b"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install Python deps for golden tasks
        run: python -m pip install --quiet pyyaml httpx pytest
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama
        run: |
          ollama serve &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
      - name: Pull model
        run: ollama pull ${{ matrix.model }}
      - name: Scaffold snapshots
        run: python tests/golden/snapshots/_scaffold.py
      - name: Run framework tests
        run: cd tests/golden && python -m pytest framework/ -q
      - name: Run golden suite against live Ollama and diff against v0.3.0 baseline
        env:
          OLLAMA_URL: "http://localhost:11434"
        run: |
          python tests/golden/framework/run_all.py \
            --model "${{ matrix.model }}" \
            --tier "${{ matrix.tier }}" \
            --baseline "tests/golden/baselines/v0.3.0-${{ matrix.tier }}.json" \
            --output "golden-results-${{ matrix.tier }}.json" \
            --report "golden-report-${{ matrix.tier }}.md"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "golden-tasks-${{ matrix.tier }}"
          path: |
            golden-results-${{ matrix.tier }}.json
            golden-report-${{ matrix.tier }}.md
            tests/golden/baselines/
          retention-days: 30
