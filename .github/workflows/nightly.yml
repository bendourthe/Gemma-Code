name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC every day
  workflow_dispatch:      # allow manual trigger

jobs:

  # ── Full integration tests (requires Ollama) ──────────────────────────────

  integration-ts:
    name: TypeScript integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          # Wait for the server to be ready
          timeout 30 bash -c 'until curl -sf http://localhost:11434/api/tags; do sleep 1; done'

      - name: Pull Gemma model (small variant for CI)
        run: ollama pull gemma4:e2b

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci --prefer-offline --no-audit --silent
      - run: npm run build

      - name: Run integration tests
        env:
          OLLAMA_URL: "http://localhost:11434"
          TEST_MODEL: "gemma4:e2b"
        run: npm run test:integration -- --reporter=verbose

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: coverage/
          retention-days: 14

  # ── Performance benchmarks ────────────────────────────────────────────────

  benchmarks:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci --prefer-offline --no-audit --silent
      - run: npm run build

      - name: Run benchmarks
        run: npm run bench -- --reporter=verbose --outputFile=bench-results.json --reporter=json 2>&1 | tee bench-results.txt

      - name: Check benchmark regressions against v0.3.0 baseline
        run: |
          node scripts/check-bench-regressions.mjs \
            --baseline tests/benchmarks/baselines/v0.3.0.json \
            --current bench-results.json \
            --regression-pct 20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            bench-results.txt
            bench-results.json
          retention-days: 30

  # -- Installer smoke tests (per-platform) -----------------------------------

  installer-smoke-windows:
    name: Installer smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Run installer smoke tests
        run: pwsh -NonInteractive -File tests/integration/installer/test-install-pyqt.ps1

  installer-smoke-macos:
    name: Installer smoke (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps and run smoke tests
        run: |
          cd scripts/installer/pyqt
          pip install -e ".[dev]" --quiet 2>/dev/null || pip install PyQt5 httpx --quiet
          cd "${{ github.workspace }}"
          bash tests/integration/installer/test-install-pyqt-macos.sh

  installer-smoke-linux:
    name: Installer smoke (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libxcb-xinerama0 libxkbcommon-x11-0
      - name: Install deps and run smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd scripts/installer/pyqt
          pip install -e ".[dev]" --quiet 2>/dev/null || pip install PyQt5 httpx --quiet
          cd "${{ github.workspace }}"
          bash tests/integration/installer/test-install-pyqt-linux.sh

  # -- Failure notification ----------------------------------------------------

  notify-on-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [integration-ts, benchmarks, installer-smoke-windows, installer-smoke-macos, installer-smoke-linux]
    if: failure()
    steps:
      - name: Send failure notification
        # Configure SLACK_WEBHOOK_URL in repository secrets to enable Slack notifications.
        # If the secret is absent the step exits silently.
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-type: application/json' \
              --data "{
                \"text\": \":x: *Gemma Code nightly* failed on \`${{ github.ref_name }}\`.\nSee: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
              }"
          fi
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
