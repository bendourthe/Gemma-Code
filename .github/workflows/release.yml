name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Rebuild and attach assets to an already-published tag (the tagged
  # commit cannot pick up a later workflow fix). Builds HEAD of the ref
  # this workflow is dispatched against.
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to attach assets to (e.g. v1.17.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:

  # -- Build VSIX (Linux, fast) -----------------------------------------------

  build-vsix:
    name: Build VSIX
    runs-on: ubuntu-latest
    outputs:
      vsix_name: ${{ steps.package.outputs.vsix_name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci --prefer-offline --no-audit

      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        id: package
        run: |
          npx vsce package --no-dependencies
          VSIX="nexus-coding-${{ steps.version.outputs.version }}.vsix"
          echo "vsix_name=$VSIX" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: vsix
          path: "*.vsix"
          retention-days: 30

  # -- Build Windows installer (PyQt5) ----------------------------------------

  build-installer-windows:
    name: Build Windows installer
    runs-on: windows-latest
    # The wizard embeds the Tauri NSIS bundle (v1.11.0 T401, fail-closed).
    # That file is produced by desktop-bundle, not by this job, so wait
    # for the Windows matrix leg's artifact rather than racing it.
    needs: [build-vsix, desktop-bundle]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: "latest"

      - name: Download VSIX artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: vsix
          path: .

      - name: Download Windows desktop bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: desktop-bundle-windows
          path: desktop-bundle-windows

      - name: Build installer
        run: pwsh -NonInteractive -File scripts/installer/build/build-windows.ps1 -SkipSign

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: installer-windows
          path: dist/NexusSetup.exe
          retention-days: 30

  # -- Build macOS installer (PyQt5) ------------------------------------------

  build-installer-macos:
    name: Build macOS installer
    runs-on: macos-latest
    needs: build-vsix
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Download VSIX artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: vsix
          path: .

      - name: Build installer
        run: bash scripts/installer/build/build-macos.sh

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: installer-macos
          path: dist/NexusSetup.dmg
          retention-days: 30

  # -- Build Linux installer (PyQt5) ------------------------------------------

  build-installer-linux:
    name: Build Linux installer
    runs-on: ubuntu-latest
    needs: build-vsix
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxcb-xinerama0 libxkbcommon-x11-0

      - name: Download VSIX artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: vsix
          path: .

      - name: Build installer
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash scripts/installer/build/build-linux.sh

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: installer-linux
          path: dist/NexusSetup-x86_64.AppImage
          retention-days: 30

  # -- Build Nexus desktop bundles (Tauri, 3-OS) -------------------------------
  #
  # v1.8.0 Phase 1 (T101): the one-shot installer fetches the desktop app from
  # the GitHub release at install time, so every release must publish
  # versioned, checksummed Tauri bundles for all three platforms. Runs on tag
  # pushes only (this workflow's sole trigger); rehearse with a pre-release
  # tag on a scratch branch. tauri.conf.json's version is synced from the
  # semantic-release-owned package.json at build time, never by hand.

  desktop-bundle:
    name: Desktop bundle (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: build-vsix
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
          - platform: linux
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Linux Tauri prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Add macOS universal targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo registry + target
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ matrix.os }}-desktop-bundle-cargo-${{ hashFiles('desktop/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ matrix.os }}-desktop-bundle-cargo-

      - name: Install workspace deps
        run: npm ci --prefer-offline --no-audit

      - name: Sync tauri.conf.json version from package.json
        run: node scripts/sync-tauri-version.mjs

      - name: Build sidecar bundle (fail-fast)
        working-directory: desktop
        run: npm run build:sidecar

      - name: Tauri build (windows / linux)
        if: matrix.platform != 'macos'
        working-directory: desktop
        run: npm run build:shell

      - name: Tauri build (macos, universal)
        if: matrix.platform == 'macos'
        working-directory: desktop
        run: npm run build:shell -- --target universal-apple-darwin

      - name: Stage bundle under its canonical release name (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $v = "${{ needs.build-vsix.outputs.version }}"
          New-Item -ItemType Directory -Force bundle-out | Out-Null
          Copy-Item "desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" "bundle-out/Nexus-Desktop_${v}_x64-setup.exe"

      - name: Stage bundle under its canonical release name (macos)
        if: matrix.platform == 'macos'
        run: |
          V="${{ needs.build-vsix.outputs.version }}"
          mkdir -p bundle-out
          cp desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "bundle-out/Nexus-Desktop_${V}_universal.dmg"

      - name: Stage bundles under their canonical release names (linux)
        if: matrix.platform == 'linux'
        run: |
          V="${{ needs.build-vsix.outputs.version }}"
          mkdir -p bundle-out
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage "bundle-out/Nexus-Desktop_${V}_amd64.AppImage"
          cp desktop/src-tauri/target/release/bundle/deb/*.deb "bundle-out/Nexus-Desktop_${V}_amd64.deb"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: desktop-bundle-${{ matrix.platform }}
          path: bundle-out/*
          retention-days: 30

  # -- Create GitHub Release ---------------------------------------------------

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-vsix, build-installer-windows, build-installer-macos, build-installer-linux, desktop-bundle]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: vsix
          path: artifacts/

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: installer-windows
          path: artifacts/

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: installer-macos
          path: artifacts/

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: installer-linux
          path: artifacts/

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: desktop-bundle-windows
          path: artifacts/

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: desktop-bundle-macos
          path: artifacts/

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: desktop-bundle-linux
          path: artifacts/

      # v1.8.0 Phase 1 (T102): one SHA256SUMS.txt covering every attached
      # asset -- the installer's desktop_provisioner verifies its downloads
      # against this file (fail closed). The explicit file list makes the
      # release fail loudly if any expected asset is missing.
      - name: Generate SHA256SUMS.txt (installer verification source)
        run: |
          VERSION="${{ needs.build-vsix.outputs.version }}"
          cd artifacts
          sha256sum \
            "${{ needs.build-vsix.outputs.vsix_name }}" \
            NexusSetup.exe \
            NexusSetup.dmg \
            NexusSetup-x86_64.AppImage \
            "Nexus-Desktop_${VERSION}_x64-setup.exe" \
            "Nexus-Desktop_${VERSION}_universal.dmg" \
            "Nexus-Desktop_${VERSION}_amd64.AppImage" \
            "Nexus-Desktop_${VERSION}_amd64.deb" \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${{ needs.build-vsix.outputs.version }}"
          NOTES=$(awk "/^#+ \\[?${VERSION}\\]?/{flag=1; next} /^#+ /{flag=0} flag" CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
          name: "Nexus v${{ needs.build-vsix.outputs.version }}"
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref, '-') || contains(github.event.inputs.tag_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/${{ needs.build-vsix.outputs.vsix_name }}
            artifacts/NexusSetup.exe
            artifacts/NexusSetup.dmg
            artifacts/NexusSetup-x86_64.AppImage
            artifacts/Nexus-Desktop_*
            artifacts/SHA256SUMS.txt
