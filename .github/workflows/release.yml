name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:

  # -- Build VSIX (Linux, fast) -----------------------------------------------

  build-vsix:
    name: Build VSIX
    runs-on: ubuntu-latest
    outputs:
      vsix_name: ${{ steps.package.outputs.vsix_name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci --prefer-offline --no-audit

      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        id: package
        run: |
          npx vsce package --no-dependencies
          VSIX="gemma-code-${{ steps.version.outputs.version }}.vsix"
          echo "vsix_name=$VSIX" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: vsix
          path: "*.vsix"
          retention-days: 30

  # -- Build Windows installer (PyQt5) ----------------------------------------

  build-installer-windows:
    name: Build Windows installer
    runs-on: windows-latest
    needs: build-vsix
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: "latest"

      - name: Download VSIX artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: vsix
          path: .

      - name: Build installer
        run: pwsh -NonInteractive -File scripts/installer/pyqt/build/build-windows.ps1 -SkipSign

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: installer-windows
          path: scripts/installer/pyqt/dist/GemmaCodeSetup.exe
          retention-days: 30

  # -- Build macOS installer (PyQt5) ------------------------------------------

  build-installer-macos:
    name: Build macOS installer
    runs-on: macos-latest
    needs: build-vsix
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Download VSIX artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: vsix
          path: .

      - name: Build installer
        run: bash scripts/installer/pyqt/build/build-macos.sh

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: installer-macos
          path: |
            scripts/installer/pyqt/dist/GemmaCodeSetup.dmg
            scripts/installer/pyqt/dist/Gemma Code Installer
          retention-days: 30

  # -- Build Linux installer (PyQt5) ------------------------------------------

  build-installer-linux:
    name: Build Linux installer
    runs-on: ubuntu-latest
    needs: build-vsix
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libxcb-xinerama0 libxkbcommon-x11-0

      - name: Download VSIX artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: vsix
          path: .

      - name: Build installer
        run: bash scripts/installer/pyqt/build/build-linux.sh

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: installer-linux
          path: |
            scripts/installer/pyqt/dist/GemmaCodeSetup-x86_64.AppImage
            scripts/installer/pyqt/dist/gemma-code-setup
          retention-days: 30

  # -- Create GitHub Release ---------------------------------------------------

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-vsix, build-installer-windows, build-installer-macos, build-installer-linux]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: vsix
          path: artifacts/

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: installer-windows
          path: artifacts/

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: installer-macos
          path: artifacts/

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: installer-linux
          path: artifacts/

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${{ needs.build-vsix.outputs.version }}"
          NOTES=$(awk "/^## \[?${VERSION}\]?/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          name: "Gemma Code v${{ needs.build-vsix.outputs.version }}"
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          files: |
            artifacts/${{ needs.build-vsix.outputs.vsix_name }}
            artifacts/GemmaCodeSetup.exe
            artifacts/GemmaCodeSetup.dmg
            artifacts/GemmaCodeSetup-x86_64.AppImage
