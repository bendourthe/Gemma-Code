name: Installer build (macOS)

# Builds NexusSetup.dmg -- the macOS outer shell around the PyQt wizard.
# v1.8.0 Phase 6 (T601) aligned this workflow with the canonical build path:
# it now calls scripts/installer/pyqt/build/build-macos.sh (spec-driven
# PyInstaller, so the bundled VSIX + registry data files apply) instead of a
# hand-rolled `pyinstaller` invocation, packages the VSIX from the repo root
# (the old `extensions/nexus-coding` path never existed), and drops the
# v1.0.0-era payload embed -- the wizard downloads everything at install
# time, SHA-256-verified (operator decision 2026-07-03).
#
# Notarization stays best-effort: without APPLE_DEVELOPER_ID secrets the
# step warns and exits 0 (unsigned DMG; Gatekeeper caveats are documented on
# the download page). A properly signed rehearsal must staple the .app and
# re-create the DMG afterwards (recorded in the v1.8.0 known-gaps).

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for the manual run"
        required: false
        default: "manual rehearsal"
  push:
    tags:
      - "v*"

concurrency:
  group: installer-build-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-installer:
    name: Build Nexus DMG
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Resolve pinned versions
        run: |
          python -c "import json; data=json.load(open('scripts/installer/devai-hub-baseline.json')); print('devai-hub baseline tag:', data['source']['tag'])"

      # The wizard bundles the VSIX (PyInstaller datas); vsce packages the
      # root workspace (the repo root IS the nexus-coding extension package,
      # same as release.yml's build-vsix job).
      - name: Build VSIX (Nexus Coding extension)
        run: |
          npm ci --prefer-offline --no-audit
          npm run build
          npx vsce package --no-dependencies

      - name: Build installer (PyInstaller wizard + DMG)
        run: bash scripts/installer/pyqt/build/build-macos.sh

      - name: Sign + notarize (best-effort)
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_B64: ${{ secrets.APPLE_NOTARY_KEY_B64 }}
        run: |
          set -e
          APP_PATH="scripts/installer/pyqt/dist/Nexus Installer.app"
          if [ -z "$APPLE_DEVELOPER_ID" ]; then
            echo "::warning::APPLE_DEVELOPER_ID not configured -- skipping codesign + notarization (unsigned DMG; see the download page caveats)"
            exit 0
          fi
          codesign --force --deep --options runtime --sign "$APPLE_DEVELOPER_ID" "$APP_PATH"
          KEYFILE="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_NOTARY_KEY_B64" | base64 -d > "$KEYFILE"
          xcrun notarytool submit --wait \
            --key "$KEYFILE" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            "$APP_PATH" || true
          xcrun stapler staple "$APP_PATH" || true
          # The DMG built by build-macos.sh predates the staple; rebuild it
          # so the shipped image carries the notarized app.
          DMG_TMP=$(mktemp -d)
          cp -R "$APP_PATH" "$DMG_TMP/"
          ln -s /Applications "$DMG_TMP/Applications"
          hdiutil create -volname "Nexus Installer" -srcfolder "$DMG_TMP" -ov -format UDBZ \
            "scripts/installer/pyqt/dist/NexusSetup.dmg"
          rm -rf "$DMG_TMP"

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: NexusSetup-macos
          path: scripts/installer/pyqt/dist/NexusSetup.dmg
          if-no-files-found: warn
          retention-days: 14
