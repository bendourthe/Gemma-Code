name: Installer build (macOS)

# Builds Nexus-<version>.dmg -- the macOS DMG outer shell that wraps the
# cross-platform PyQt5 wizard introduced in v1.1.0 Phase 14. The job ships
# the same payload as the Windows installer (CUDA replaced with the MPS
# wheels), notarized + stapled for Gatekeeper. Tagging a release pushes the
# dmg as an artifact; manual reruns (workflow_dispatch) still work for
# rehearsals.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for the manual run"
        required: false
        default: "manual rehearsal"
  push:
    tags:
      - "v*"

concurrency:
  group: installer-build-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-installer:
    name: Build Nexus DMG
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      NEXUS_PLATFORM: macos-arm64
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.x"

      # YAML note: a bare `run: echo "X: Y"` (unquoted scalar containing a
      # colon-space) is parsed as a nested mapping. We use the block scalar
      # `run: |` so the inner colons are safe.

      - name: Resolve pinned versions
        run: |
          python -c "import json,sys; data=json.load(open('scripts/installer/devai-hub-baseline.json')); print('devai-hub baseline tag:', data['source']['tag'])"

      - name: Fetch payload (Python, wheels-mac, Node, Ollama, ffmpeg, DevAI-Hub)
        run: |
          python scripts/installer/build/fetch-payload.py \
            --os mac --arch arm64 \
            --out build/payload/

      - name: Build VSIX (Nexus Coding extension)
        run: |
          npm install -g @vscode/vsce
          (cd extensions/nexus-coding && vsce package --out ../../build/payload/extensions/nexus-coding-${GITHUB_REF_NAME:-dev}.vsix)

      - name: Install Python deps + PyInstaller
        run: |
          cd scripts/installer/pyqt
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Freeze the wizard with PyInstaller
        run: |
          cd scripts/installer/pyqt
          pyinstaller --noconfirm --windowed --name nexus-installer \
            --add-data "../../../build/payload:payload" \
            src/nexus_installer/main.py

      - name: Sign + notarize (best-effort)
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_B64: ${{ secrets.APPLE_NOTARY_KEY_B64 }}
        run: |
          set -e
          APP_PATH="scripts/installer/pyqt/dist/nexus-installer.app"
          if [ -z "$APPLE_DEVELOPER_ID" ]; then
            echo "::warning::APPLE_DEVELOPER_ID not configured -- skipping codesign + notarization (Phase 15 / OA-11 closes this)"
            exit 0
          fi
          codesign --force --deep --options runtime --sign "$APPLE_DEVELOPER_ID" "$APP_PATH"
          KEYFILE="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_NOTARY_KEY_B64" | base64 -d > "$KEYFILE"
          xcrun notarytool submit --wait \
            --key "$KEYFILE" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            "$APP_PATH" || true
          xcrun stapler staple "$APP_PATH" || true

      - name: Create the DMG (drag-to-Applications)
        run: |
          set -e
          npm install -g create-dmg
          VERSION="${GITHUB_REF_NAME:-1.1.0-dev}"
          mkdir -p build/dmg-stage
          cp -R scripts/installer/pyqt/dist/nexus-installer.app build/dmg-stage/Nexus.app
          create-dmg \
            --overwrite \
            --dmg-title "Nexus ${VERSION}" \
            --identity "${APPLE_DEVELOPER_ID:-}" \
            build/dmg-stage/Nexus.app build/ || true
          # create-dmg names the output Nexus-<version>.dmg; fall back to a
          # deterministic name when the tool errored (e.g. unsigned build).
          if ! ls build/Nexus*.dmg >/dev/null 2>&1; then
            hdiutil create -fs HFS+ -srcfolder build/dmg-stage -volname "Nexus ${VERSION}" "build/Nexus-${VERSION}.dmg"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: Nexus-macOS-dmg
          path: build/Nexus*.dmg
          if-no-files-found: warn
          retention-days: 14
