name: Installer rehearsal (macOS, non-release)

# Manual non-release rehearsal for the macOS Python wizard build. v1.9.0 Phase 1
# (T102/T103) made the PyInstaller onefile (spec APP_NAME "Nexus AI Studio
# Setup") the distributable directly: build-macos.sh freezes it into a staging
# dir and packages exactly one artifact, dist/NexusSetup.dmg, at the repo root.
# There is no NSIS/outer-shell layer on any platform anymore.
#
# This workflow is intentionally dispatch-only and its artifact is not a
# v2.2.9 release asset because the Python wizard does not stage the desktop
# payload on macOS. Tag releases run release.yml and publish the checksummed
# Tauri desktop DMG directly.
#
# Notarization stays best-effort: without APPLE_DEVELOPER_ID secrets the step
# warns and exits 0 (unsigned DMG; Gatekeeper caveats are documented on the
# download page). Signing + notarization remains rehearsal-only here.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for the manual non-release rehearsal"
        required: false
        default: "manual rehearsal"

concurrency:
  group: installer-build-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-installer:
    name: Build manual macOS installer rehearsal
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.x"
          cache: "npm"

      # The wizard bundles the VSIX (PyInstaller datas). The canonical script
      # packages the root workspace and rebuilds native modules for VS Code
      # Electron before the installer consumes the artifact.
      - name: Build VSIX (Nexus Coding extension)
        shell: pwsh
        run: ./scripts/build-vsix.ps1 -SkipTests

      - name: Build non-release installer rehearsal (PyInstaller onefile + DMG)
        run: bash scripts/installer/build/build-macos.sh

      - name: Sign + notarize (best-effort)
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_B64: ${{ secrets.APPLE_NOTARY_KEY_B64 }}
        run: |
          set -e
          DMG_PATH="dist/NexusSetup.dmg"
          if [ -z "$APPLE_DEVELOPER_ID" ]; then
            echo "::warning::APPLE_DEVELOPER_ID not configured -- skipping codesign + notarization (unsigned DMG; see the download page caveats)"
            exit 0
          fi
          # Sign the staged onefile payload (bundle or bare binary), then
          # notarize + staple the shipped DMG directly.
          STAGE="scripts/installer/build/stage"
          PAYLOAD="$STAGE/Nexus AI Studio Setup.app"
          [ -d "$PAYLOAD" ] || PAYLOAD="$STAGE/Nexus AI Studio Setup"
          codesign --force --deep --options runtime --sign "$APPLE_DEVELOPER_ID" "$PAYLOAD" || true
          KEYFILE="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_NOTARY_KEY_B64" | base64 -d > "$KEYFILE"
          xcrun notarytool submit --wait \
            --key "$KEYFILE" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            "$DMG_PATH" || true
          xcrun stapler staple "$DMG_PATH" || true

      - name: Upload non-release rehearsal artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: NexusSetup-macos-rehearsal
          path: dist/NexusSetup.dmg
          if-no-files-found: warn
          retention-days: 14
