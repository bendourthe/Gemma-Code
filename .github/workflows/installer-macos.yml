name: Installer build (macOS)

# Builds NexusSetup.dmg -- the macOS one-shot installer. v1.9.0 Phase 1
# (T102/T103) made the PyInstaller onefile (spec APP_NAME "Nexus AI Studio
# Setup") the distributable directly: build-macos.sh freezes it into a staging
# dir and packages exactly one artifact, dist/NexusSetup.dmg, at the repo root.
# There is no NSIS/outer-shell layer on any platform anymore.
#
# Notarization stays best-effort: without APPLE_DEVELOPER_ID secrets the step
# warns and exits 0 (unsigned DMG; Gatekeeper caveats are documented on the
# download page). Signing + notarization is a recorded deferral for this cycle.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for the manual run"
        required: false
        default: "manual rehearsal"
  push:
    tags:
      - "v*"

concurrency:
  group: installer-build-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-installer:
    name: Build Nexus DMG
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.x"
          cache: "npm"

      # The wizard bundles the VSIX (PyInstaller datas); vsce packages the
      # root workspace (the repo root IS the nexus-coding extension package,
      # same as release.yml's build-vsix job).
      - name: Build VSIX (Nexus Coding extension)
        run: |
          npm ci --prefer-offline --no-audit
          npm run build
          npx vsce package --no-dependencies

      - name: Build installer (PyInstaller onefile + DMG)
        run: bash scripts/installer/build/build-macos.sh

      - name: Sign + notarize (best-effort)
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_B64: ${{ secrets.APPLE_NOTARY_KEY_B64 }}
        run: |
          set -e
          DMG_PATH="dist/NexusSetup.dmg"
          if [ -z "$APPLE_DEVELOPER_ID" ]; then
            echo "::warning::APPLE_DEVELOPER_ID not configured -- skipping codesign + notarization (unsigned DMG; see the download page caveats)"
            exit 0
          fi
          # Sign the staged onefile payload (bundle or bare binary), then
          # notarize + staple the shipped DMG directly.
          STAGE="scripts/installer/build/stage"
          PAYLOAD="$STAGE/Nexus AI Studio Setup.app"
          [ -d "$PAYLOAD" ] || PAYLOAD="$STAGE/Nexus AI Studio Setup"
          codesign --force --deep --options runtime --sign "$APPLE_DEVELOPER_ID" "$PAYLOAD" || true
          KEYFILE="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_NOTARY_KEY_B64" | base64 -d > "$KEYFILE"
          xcrun notarytool submit --wait \
            --key "$KEYFILE" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            "$DMG_PATH" || true
          xcrun stapler staple "$DMG_PATH" || true

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: NexusSetup-macos
          path: dist/NexusSetup.dmg
          if-no-files-found: warn
          retention-days: 14
