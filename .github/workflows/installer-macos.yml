name: Installer build (macOS)

# Builds Nexus-1.0.0.dmg -- the macOS DMG outer shell that wraps the same
# PyQt5 wizard the Windows installer ships. Scoped for v1.0.1 release; v1.0.0
# only requires this workflow file to exist (gated behind workflow_dispatch)
# so the cross-platform CI stubs are in place. See
# docs/v1.0.0/installer-macos-and-linux.md.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for the manual run"
        required: false
        default: "manual rehearsal"

concurrency:
  group: installer-build-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-installer:
    name: Build Nexus-1.0.0.dmg
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.x"

      - name: Resolve pinned versions
        run: echo "TODO v1.0.1: read scripts/installer/devai-hub-baseline.json + pyproject.toml + .nvmrc"

      - name: Fetch payload (Python, wheels, Node, Ollama, ffmpeg, DevAI-Hub)
        run: echo "TODO v1.0.1: run scripts/installer/build/fetch-payload.py --out build/payload/ --platform macos-arm64"

      - name: Freeze the wizard with PyInstaller
        run: echo "TODO v1.0.1: uv run pyinstaller --onefile --windowed --name nexus-installer src/nexus_installer/main.py"

      - name: Create the DMG (drag-to-Applications)
        run: echo "TODO v1.0.1: hdiutil create -fs HFS+ -srcfolder build/macos-app/ -volname Nexus build/Nexus-1.0.0.dmg"

      - name: Sign + notarize
        run: echo "TODO v1.0.1: codesign + xcrun notarytool submit (needs Developer ID cert)"

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: Nexus-1.0.0-dmg
          path: build/Nexus-1.0.0.dmg
          if-no-files-found: warn
          retention-days: 14
