# v1.19.0 Phase 4: installer pytest + headless-smoke, path-gated so
# unrelated pushes do not pay PyQt apt + uv sync. Catalog/registry
# changes still run the job (LFM pin, licenseNote, 8B-A1B absence).
# v2.2.5: scripts/installer/** covers snapshot-latest stubs
# (NEXUS_HUB_LATEST_TAG) and the stale-3.12.0 refusal. Do not clone Hub.
# v2.2.6: no installer or runtime.json change. Studio sessions live at
# ~/.nexus/generations/sessions.db (same generations/ tree as studio.db).
# Silent no-op; do not clone Hub.
# v2.2.7: scripts/installer/** covers Models tab context chips (`<val>k`,
# no trailing "in"; null window omits the chip). Do not clone Hub.
# v2.2.8 Phase 4: scripts/installer/** covers catalog_tab_sort (family
# collapse + hideBelowVram + over-budget last) dual-asserted against
# tests/fixtures/v2.2.8-catalog-tab-sort.json. Do not clone Hub.
# v2.2.8 Phase 5: pack-time stale 3.12.0 refusal is unchanged
# (test_hub_catalog_provisioner). Install-time --sync-hub-catalog apply with
# per-skill quarantine lives in sidecar/unit tests, not this pytest job.
# Do not clone Hub.
# v2.2.8 Phase 6: T009/T010 catalog_tab_sort and T012 pack-time 3.12.0
# refusal stay in this job. No live GPU. Do not clone Hub.
# PRs to main use the same path filter. workflow_dispatch always runs.
name: Installer tests

on:
  push:
    branches-ignore: ["dependabot/**"]
    paths:
      - "scripts/installer/**"
      - "desktop/src-tauri/**"
      - "desktop/sidecar/**"
      - "core/registry/catalog.json"
      - "core/registry/catalog.ts"
      - "core/registry/recommended.json"
      - "core/registry/NexusModelRegistry.ts"
      - "core/registry/ModelCatalog.ts"
      - "core/registry/models.json"
      - "core/registry/patientTier.ts"
      - "core/config/**"
      - "tests/fixtures/v2.2.8-catalog-tab-sort.json"
      - "desktop/src/shared/models/catalogTabs.ts"
      - ".github/workflows/installer-tests.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/installer/**"
      - "desktop/src-tauri/**"
      - "desktop/sidecar/**"
      - "core/registry/catalog.json"
      - "core/registry/catalog.ts"
      - "core/registry/recommended.json"
      - "core/registry/NexusModelRegistry.ts"
      - "core/registry/ModelCatalog.ts"
      - "core/registry/models.json"
      - "core/registry/patientTier.ts"
      - "core/config/**"
      - "tests/fixtures/v2.2.8-catalog-tab-sort.json"
      - "desktop/src/shared/models/catalogTabs.ts"
      - ".github/workflows/installer-tests.yml"
  workflow_dispatch: {}

concurrency:
  group: installer-tests-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-installer:
    name: Installer tests + lint + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@e4db8464a088ece1b920f60402e813ea4de65b8f # v4
        with:
          version: "latest"
          enable-cache: true
          # uv.lock is gitignored; key the cache on the tracked pyproject instead.
          cache-dependency-glob: scripts/installer/pyproject.toml
          ignore-nothing-to-cache: true

      - name: Install system deps for PyQt5
        run: sudo apt-get update && sudo apt-get install -y libxcb-xinerama0 libxkbcommon-x11-0

      - name: Sync installer deps
        run: |
          cd scripts/installer
          uv sync --quiet

      - name: Run installer tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd scripts/installer
          uv run pytest tests/ -v --tb=short

      # v1.11.0 Phase 8 (T803): the headless-smoke (T202) result-JSON contract,
      # run end-to-end on a clean Linux runner with a network-free profile
      # (venv-only, a no-op since ADR-0001). This is the "Linux path now" gate.
      # The full multi-component clean-machine run stays an operator Windows
      # Sandbox action (IO.P2.A). The GitHub Actions budget freeze ended
      # 2026-08-01; this job is ubuntu-only and path-filtered instead of a
      # new Windows matrix. Hard gate.
      - name: Headless-smoke result-JSON contract (network-free)
        run: |
          set -euo pipefail
          cd scripts/installer
          uv run python -m nexus_installer.main \
            --headless-smoke testing/profiles/ci-linux.json \
            --smoke-output "$RUNNER_TEMP/ci-smoke-result.json"
          python3 - "$RUNNER_TEMP/ci-smoke-result.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1], encoding="utf-8"))
          assert r["schema"] == "nexus-smoke-result/v1", r.get("schema")
          assert r["success"] is True, r
          assert r["steps_failed"] == [], r
          print("headless-smoke contract OK:", r["steps_done"])
          PY

      # ruff runs in CI for visibility but is NOT a hard gate yet: the pre-existing
      # installer lint baseline (NHC.P5.A) is deferred to a dedicated cleanup cycle,
      # and every v1.11.0-touched file is already clean (fix-what-you-touch). Flip
      # to gating once the baseline is zeroed.
      - name: Ruff (advisory -- deferred NHC.P5.A baseline)
        continue-on-error: true # nexus-check-allow: no-disabled-ci-check -- advisory visibility over the deferred NHC.P5.A installer lint baseline; pytest + the smoke contract are the hard gates
        run: |
          cd scripts/installer
          uv run ruff check src tests

      # mypy is advisory for the same reason, plus its installer baseline is
      # platform-conditional (PyQt5 stub quirks; the ctypes.windll type:ignore
      # flips between Windows and Linux), so it cannot be a clean cross-platform
      # hard gate without restructuring.
      - name: mypy (advisory -- deferred NHC.P5.A baseline + PyQt5 stubs)
        continue-on-error: true # nexus-check-allow: no-disabled-ci-check -- advisory visibility over the deferred, platform-conditional NHC.P5.A mypy baseline
        run: |
          cd scripts/installer
          uv run mypy src
