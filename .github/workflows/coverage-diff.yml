name: Coverage Diff

# v0.9.0 Phase 4 sub-task 4.2 -- supplements (does NOT replace) the global
# vitest coverage thresholds in configs/vitest.config.ts. Enforces 80% line
# coverage *on lines changed in the PR* using `diff-cover` (a local Python
# CLI, no third-party service). When the gate fails, the markdown report is
# posted back as a PR comment to make the diff visible to the contributor.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["main"]

concurrency:
  group: coverage-diff-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  diff-cover:
    name: diff-cover (80% on changed lines)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "npm"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - run: npm ci --prefer-offline --no-audit

      - name: Run vitest with coverage
        run: npm run test -- --coverage
        env:
          CI: "true"

      - name: Install diff-cover (pinned)
        run: python -m pip install --quiet "diff-cover==9.2.0"

      - name: Fetch base branch for diff
        run: git fetch origin main --depth=1

      - name: Run diff-cover on changed lines
        id: diff-cover
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ ! -f coverage/lcov.info ]; then
            echo "::error::coverage/lcov.info missing -- vitest must emit the lcov reporter"
            exit 1
          fi
          diff-cover coverage/lcov.info \
            --compare-branch=origin/main \
            --fail-under=80 \
            --markdown-report=diff-coverage.md \
            --html-report=diff-coverage.html

      - name: Upload diff-cover reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diff-coverage
          path: |
            diff-coverage.md
            diff-coverage.html
          retention-days: 14

      - name: Comment diff-cover report on PR (on failure only)
        if: steps.diff-cover.outcome == 'failure' && github.event.pull_request.number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f diff-coverage.md ]; then
            gh pr comment "$PR_NUMBER" --body-file diff-coverage.md
          else
            gh pr comment "$PR_NUMBER" --body "diff-cover failed but no markdown report was produced. Check the workflow logs."
          fi

      - name: Fail job when diff-cover failed
        if: steps.diff-cover.outcome == 'failure'
        run: |
          echo "::error::Changed-lines coverage is below 80% (see diff-coverage.md artifact and PR comment)"
          exit 1
