# Dependabot v2 configuration for Nexus-AI
#
# Opens grouped dependency PRs MONTHLY with a low open-PR limit. Rationale: each
# Dependabot PR triggers CI, and CI minutes are a single account-wide GitHub
# Actions pool shared across all repos. Monthly + grouping + a small limit keeps
# that cost bounded (a couple of PRs per ecosystem per month, not one per
# package). CI is configured to skip the heavy fleet on Dependabot PRs (see the
# `dependabot[bot]` guards in .github/workflows). Do NOT auto-merge.
#
# Major-version bumps for vscode-related dependencies are ignored on purpose:
# they need manual coordination with the engines.vscode pin.
#
# `labels` blocks are intentionally omitted. Dependabot rejects an entire
# config update when any label in the list is missing from the repo, and
# applying labels during PR creation requires the labels to exist first.
# To re-enable labelling, create the labels in the GitHub repo Settings ->
# Labels (e.g. `dependencies`, `auto-update`, `github-actions`,
# `python-installer`) and then add a `labels:` block per ecosystem.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    # Kept intentionally low: fewer concurrent PRs => fewer CI runs. Raise once
    # the Actions minutes budget is healthy again.
    open-pull-requests-limit: 3
    # Group only minor/patch updates. Major-version bumps come as
    # individual PRs because each one needs an isolated review (breaking
    # API changes, ecosystem-wide ramifications). Without the
    # `update-types` filter Dependabot folds majors into the group, which
    # produces grouped PRs that cannot safely be merged as a unit.
    groups:
      dev-dependencies-minor:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      runtime-dependencies-minor:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "vscode"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major"]
      # web-tree-sitter must move in lockstep with the prebuilt grammar .wasm in
      # `tree-sitter-wasms`. The 0.26 runtime is ABI-incompatible with the
      # grammars shipped by tree-sitter-wasms@0.1.13 (its latest), so the WASM
      # dylink load fails and the codegraph TreeSitterScanner tests break. Hold
      # at 0.25.x (patch bumps still allowed); lift this once tree-sitter-wasms
      # ships a 0.26-ABI grammar build and bump both together.
      - dependency-name: "web-tree-sitter"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 2

  - package-ecosystem: "pip"
    directory: "/scripts/installer/pyqt"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
